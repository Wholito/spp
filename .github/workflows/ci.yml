name: check

on:
  push:
  pull_request:

jobs:
  lab2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab2/server/package-lock.json
      - run: npm ci
      - run: find . -path './node_modules' -prune -o -name '*.js' -exec node --check '{}' \;
      - run: node --check ../client/app.js && node --check ../client/search.js && node --check ../client/trash.js
  lab3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab3/server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check ../client/app.js && node --check ../client/security.js
