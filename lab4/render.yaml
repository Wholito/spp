services:
  - type: web
    name: spp-lab4-rubezh
    runtime: node
    rootDir: lab4
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
    disk:
      name: game-data
      mountPath: /app/data
      sizeGB: 1
