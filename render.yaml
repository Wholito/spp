services:
  - type: web
    name: spp-lab4-rubezh
    runtime: node
    plan: free
    rootDir: lab4
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: spp-lab4-data
          property: connectionString
databases:
  - name: spp-lab4-data
    plan: free
